name: aslamel | Build cognee images for the home lab

# Fork-only workflow: builds the API (with the FalkorDB adapter), MCP and UI
# images from aslamel/main for linux/amd64 and pushes them to ghcr.io. Deploy
# pins them by digest in home-self-hosted gitops/workloads/cognee/values.yaml.

on:
  push:
    branches:
      - aslamel/main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/dangerousplay

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "tag=${version}-aslamel.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  api:
    needs: tag
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.20.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the upstream image from this fork
        run: docker build --platform linux/amd64 -t cognee-base:local -f Dockerfile .
      - name: Build the overlay
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=cognee-base:local \
            -t "$REGISTRY/cognee:${{ needs.tag.outputs.tag }}" \
            -f deploy/aslamel/api.Containerfile .
      - name: Adapter imports with this cognee
        run: docker run --rm --entrypoint python "$REGISTRY/cognee:${{ needs.tag.outputs.tag }}" -c "import cognee, cognee_community_hybrid_adapter_falkor.register"
      - name: FalkorDB round trip
        run: |
          docker run --rm --network host --entrypoint python \
            "$REGISTRY/cognee:${{ needs.tag.outputs.tag }}" \
            /app/deploy/aslamel/falkor_roundtrip.py 127.0.0.1 6379
      - name: Push
        run: docker push "$REGISTRY/cognee:${{ needs.tag.outputs.tag }}"

  mcp:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: cognee-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/cognee-mcp:${{ needs.tag.outputs.tag }}

  ui:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./cognee-frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/cognee-ui:${{ needs.tag.outputs.tag }}
